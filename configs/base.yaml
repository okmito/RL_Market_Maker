# Base configuration for RL Market Maker
# All values can be overridden by environment-specific configs

# Environment
environment: "simulation"  # simulation | testnet

# Symbol
symbol: "BTCUSDT"
base_asset: "BTC"
quote_asset: "USDT"

# Exchange
exchange:
  testnet_base_url: "https://testnet.binance.vision"
  testnet_ws_url: "wss://testnet.binance.vision/ws"
  production_base_url: "https://api.binance.com"
  production_ws_url: "wss://stream.binance.com:9443/ws"
  recv_window: 5000
  request_timeout: 10

# Market Data
market_data:
  depth_levels: 20
  update_speed: "100ms"  # 100ms | 1000ms
  snapshot_interval: 3600  # seconds
  max_reconnect_attempts: 10
  reconnect_base_delay: 1.0
  reconnect_max_delay: 60.0
  heartbeat_interval: 30

# Limit Order Book
lob:
  max_price_levels: 100
  price_precision: 8
  quantity_precision: 8
  validate_sequence: true
  allow_crossed_book: false
  stale_threshold_ms: 5000

# Features
features:
  lookback_window: 50
  normalization_window: 1000
  depth_levels_for_features: 10
  include_microstructure: true
  include_agent_state: true

# Simulator
simulator:
  initial_price: 50000.0
  initial_spread_bps: 10
  tick_size: 0.01
  lot_size: 0.0001
  min_order_size: 0.0001
  max_order_size: 10.0
  maker_fee_bps: 1.0
  taker_fee_bps: 5.0
  latency_ms: 10
  fill_model: "queue_aware"  # conservative | queue_aware
  volatility: 0.02
  drift: 0.0
  mean_reversion: 0.1
  jump_probability: 0.001
  jump_size: 0.05

# Risk Management
risk:
  max_inventory: 1.0
  max_inventory_ratio: 0.8
  target_inventory: 0.0
  max_position_usd: 100000.0
  max_daily_loss_usd: 5000.0
  max_order_count_per_minute: 100
  max_open_orders: 20
  inventory_penalty_coeff: 0.1
  adverse_selection_penalty_coeff: 0.05

# RL Environment
rl_env:
  observation_type: "continuous"  # continuous | discrete
  action_type: "continuous"  # continuous | discrete
  max_episode_steps: 10000
  reward_scaling: 1.0
  include_inventory_in_obs: true
  include_pnl_in_obs: true
  include_open_orders_in_obs: true

# Action Space
action_space:
  bid_offset_min_bps: -50
  bid_offset_max_bps: 50
  ask_offset_min_bps: -50
  ask_offset_max_bps: 50
  size_min_ratio: 0.1
  size_max_ratio: 2.0
  inventory_skew_min: -1.0
  inventory_skew_max: 1.0

# Reward Function
reward:
  pnl_weight: 1.0
  transaction_cost_weight: 1.0
  inventory_penalty_weight: 0.5
  adverse_selection_weight: 0.3
  cancel_penalty_weight: 0.01
  risk_penalty_weight: 0.2
  realized_pnl_weight: 1.0
  unrealized_pnl_weight: 0.1

# PPO Training
ppo:
  algorithm: "PPO"
  framework: "torch"
  num_workers: 2
  num_envs_per_worker: 1
  train_batch_size: 4000
  sgd_minibatch_size: 128
  num_sgd_iter: 10
  lr: 3e-4
  gamma: 0.99
  lambda: 0.95
  clip_param: 0.2
  vf_clip_param: 10.0
  entropy_coeff: 0.01
  entropy_coeff_schedule: null
  kl_coeff: 0.2
  kl_target: 0.01
  grad_clip: 0.5
  model:
    fcnet_hiddens: [256, 256]
    fcnet_activation: "relu"
    vf_share_layers: false
    free_log_std: true

# Training
training:
  total_timesteps: 1000000
  checkpoint_freq: 10
  evaluation_interval: 50
  evaluation_duration: 10
  evaluation_duration_unit: "episodes"
  seed: 42
  experiment_name: "rl_market_maker"
  storage_path: "./models"

# Evaluation
evaluation:
  num_episodes: 100
  baseline_strategies:
    - "fixed_spread"
    - "inventory_skew"
  metrics:
    - "total_pnl"
    - "realized_pnl"
    - "unrealized_pnl"
    - "sharpe_ratio"
    - "max_drawdown"
    - "inventory_variance"
    - "fill_rate"
    - "spread_captured"
    - "adverse_selection"
    - "transaction_costs"

# Backtest
backtest:
  data_source: "synthetic"  # synthetic | recorded | testnet
  start_date: null
  end_date: null
  initial_cash: 100000.0
  initial_inventory: 0.0
  commission_bps: 1.0
  slippage_bps: 0.5

# Logging
logging:
  level: "INFO"
  format: "json"
  file: "logs/market_maker.log"
  rotation: "1 day"
  retention: "7 days"
  compression: "gz"

# API
api:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  enable_dashboard: true