# Training Configuration
# Overrides for training runs

environment: "simulation"

training:
  total_timesteps: 2000000
  checkpoint_freq: 20
  evaluation_interval: 50
  evaluation_duration: 20
  evaluation_duration_unit: "episodes"
  seed: 42
  experiment_name: "rl_market_maker_ppo"
  storage_path: "./models"

ppo:
  num_workers: 4
  num_envs_per_worker: 2
  train_batch_size: 8000
  sgd_minibatch_size: 256
  num_sgd_iter: 15
  lr: 3e-4
  lr_schedule: null
  gamma: 0.99
  lambda: 0.95
  clip_param: 0.2
  vf_clip_param: 10.0
  entropy_coeff: 0.01
  entropy_coeff_schedule: [[0, 0.01], [1000000, 0.001]]
  kl_coeff: 0.2
  kl_target: 0.01
  grad_clip: 0.5
  model:
    fcnet_hiddens: [512, 512, 256]
    fcnet_activation: "relu"
    vf_share_layers: false
    free_log_std: true
    use_lstm: false
    lstm_cell_size: 256
    lstm_use_prev_action: true
    lstm_use_prev_reward: true

# Callbacks
callbacks:
  - "market_maker.agents.callbacks.MarketMakerCallback"

# W&B or TensorBoard (optional)
logger_config:
  type: "tb"  # tb | wandb | none
  log_dir: "./logs/tensorboard"
  project: "rl-market-maker"
  entity: null

# Hyperparameter tuning (Ray Tune)
tune:
  enabled: false
  num_samples: 10
  max_concurrent_trials: 2
  search_alg: "bayesopt"  # bayesopt | hyperopt | random
  scheduler: "asha"  # asha | pbt | fifo
  param_space:
    lr:
      type: "loguniform"
      lower: 1e-5
      upper: 1e-3
    clip_param:
      type: "uniform"
      lower: 0.1
      upper: 0.3
    entropy_coeff:
      type: "loguniform"
      lower: 1e-4
      upper: 0.1
    train_batch_size:
      type: "choice"
      values: [4000, 8000, 16000]